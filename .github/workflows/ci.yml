name: Validación de Rift Director

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Sintaxis, recursos y simulación
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check src/core/rng.js
          node --check src/core/state.js
          node --check src/core/calendar.js
          node --check src/core/persistence.js
          node --check src/core/finance.js
          node --check src/core/map-state.js
          node --check src/core/minimap-graph.js
          node --check src/core/lane-economy.js
          node --check src/core/power-economy.js
          node --check src/core/neutral-objectives.js
          node --check src/core/shutdowns.js
          node --check src/core/navigation.js
          node --check src/core/vision-wards.js
          node --check src/core/tactical-ai.js
          node --check src/core/counterplay.js
          node --check src/core/encounters.js
          node --check src/core/minimap-simulation.js
          node --check src/ui/minimap.js
          node --check src/core/broadcast.js
          node --check src/core/replay.js
          node --check src/core/match-stats.js
          node --check src/core/match-events.js
          node --check game.js
      - name: Comprobar archivos y recursos de Pages
        run: node scripts/check-static.mjs
      - name: Pruebas de simulación y guardado
        run: node --test
