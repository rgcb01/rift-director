name: Card art · pixels and budgets
on:
  push:
    paths: ['assets/card-art/**', 'scripts/*card-art.py', 'src/card-game/catalog.mjs', '.github/workflows/card-art.yml']
  pull_request:
    paths: ['assets/card-art/**', 'scripts/*card-art.py', 'src/card-game/catalog.mjs', '.github/workflows/card-art.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==13.0.0
      - run: python scripts/validate-card-art.py
