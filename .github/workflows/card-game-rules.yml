name: Card Game · reglas y regresión rápida

on:
  push:
    paths:
      - 'src/card-game/**'
      - 'tests/card-game*.test.mjs'
      - 'CARD_GAME_RULES.md'
      - '.github/workflows/card-game-rules.yml'
  pull_request:
    paths:
      - 'src/card-game/**'
      - 'tests/card-game*.test.mjs'
      - 'CARD_GAME_RULES.md'
      - '.github/workflows/card-game-rules.yml'

permissions:
  contents: read

jobs:
  card-game:
    name: Reglas, combates y objetivos
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis del motor
        run: |
          node --check src/card-game/engine.mjs
          node --check src/card-game/simple-bot.mjs
          node --check src/card-game/starter-decks.mjs
          node --check src/card-game/demo-ui.mjs
          node --check src/card-game/collection.mjs
          node --check src/card-game/collection-ui.mjs
          node --check src/card-game/deck-library.mjs
          node --check src/card-game/deck-builder-ui.mjs
      - name: Tests rápidos del Card Game
        run: node --test tests/card-game*.test.mjs
