name: UX visual smoke (Chromium)

on:
  pull_request:
    paths:
      - 'game.js'
      - 'styles.css'
      - 'index.html'
      - 'legacy-moba.html'
      - 'scripts/check-static.mjs'
      - 'src/ui/**'
      - 'e2e/**'
      - 'src/card-game/**'
      - 'card-game.html'
      - 'card-game.css'
      - 'card-art.css'
      - 'assets/card-art/**'
      - 'playwright.config.cjs'
      - 'card-game-mobile.css'
      - 'card-game-tutorial.css'
      - 'card-game-desktop.css'
      - 'deck-builder.html'
      - 'deck-builder.css'
      - 'collection.html'
      - 'collection.css'
      - '.github/workflows/ux-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Navegador real · 360 / 768 / 1440 px
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar runner de pruebas Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Instalar Chromium y dependencias
        run: npx playwright install --with-deps chromium
      - name: Iniciar servidor de páginas estáticas
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/rift-ux-server.log 2>&1 &
          sleep 2
      - name: Verificar navegación y capturar pantallas
        run: npx playwright test e2e/ux-browser.spec.cjs e2e/card-game.spec.cjs e2e/card-art.spec.cjs e2e/tutorial.spec.cjs e2e/desktop-board.spec.cjs --workers=1 --reporter=line
      - name: Adjuntar capturas y pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-visual-${{ github.sha }}
          path: |
            ux-screenshots/*.png
            docs/screenshots/card-art-v092/*.png
            test-results/**
          if-no-files-found: warn
          retention-days: 14
